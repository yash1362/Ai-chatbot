<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: 'Arial', sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        h1 {
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            width: 800px;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 10px;
            color: #fff;
            font-size: 1.5em;
        }

        .score {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .score-label {
            font-size: 0.8em;
            opacity: 0.8;
        }

        .score-value {
            font-size: 2em;
            font-weight: bold;
            color: #00ff88;
        }

        canvas {
            border: 3px solid #00ff88;
            background-color: #0a0e27;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            cursor: none;
        }

        .instructions {
            color: #fff;
            text-align: center;
            font-size: 0.9em;
            opacity: 0.8;
            max-width: 800px;
        }

        .instructions p {
            margin: 5px 0;
        }

        .game-status {
            color: #00ff88;
            font-size: 1.2em;
            font-weight: bold;
            text-align: center;
            min-height: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 PONG GAME 🎮</h1>
        <div class="scoreboard">
            <div class="score">
                <span class="score-label">PLAYER</span>
                <span class="score-value" id="playerScore">0</span>
            </div>
            <div class="score">
                <span class="score-label">COMPUTER</span>
                <span class="score-value" id="computerScore">0</span>
            </div>
        </div>
        <div class="game-status" id="gameStatus">Click to Start</div>
        <canvas id="pongCanvas" width="800" height="400"></canvas>
        <div class="instructions">
            <p><strong>Controls:</strong></p>
            <p>🖱️ Move Mouse vertically to control left paddle</p>
            <p>⬆️ ⬇️ Arrow Keys: Up/Down to control left paddle</p>
            <p>First to 5 points wins! Click canvas to start/pause</p>
        </div>
    </div>

    <script src="pong-game.js"></script>
</body>
</html>
